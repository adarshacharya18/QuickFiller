<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="104" ry="104" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="12" stroke-opacity="0.3"/>

  <!-- Subtle Glow Layer -->
  <path d="M 276,76 L 146,280 L 254,280 L 226,436 L 366,232 L 258,232 Z" fill="#0ea5e9" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Lightning Bolt -->
  <path d="M 276,76 L 146,280 L 254,280 L 226,436 L 366,232 L 258,232 Z" fill="url(#boltGrad)" stroke="#e0f2fe" stroke-width="8" stroke-linejoin="round" stroke-linecap="round"/>
</svg>